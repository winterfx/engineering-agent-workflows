name: engineering-agent-workflows

env_file:
  - .env

agents:
  issue-triage:
    enabled: true
    display_name: GitHub Issue Triage
    description: Normalize, classify, prioritize, relate, and summarize GitHub Issues.
    provider: codex
    image: ghcr.io/chaitin/agent-compose-guest:latest

    driver:
      docker: {}

    env:
      ENGINEERING_AGENT_WORKFLOWS_REPO: ${ENGINEERING_AGENT_WORKFLOWS_REPO}
      ENGINEERING_AGENT_WORKFLOWS_REF: ${ENGINEERING_AGENT_WORKFLOWS_REF}
      GITHUB_TOKEN:
        value: ${GITHUB_TOKEN}
        secret: true
      GITHUB_API_URL: ${GITHUB_API_URL}
      ISSUE_TRIAGE_MODEL: ${ISSUE_TRIAGE_MODEL}
      ISSUE_TRIAGE_APPLY: ${ISSUE_TRIAGE_APPLY}
      ISSUE_TRIAGE_BOT_LOGIN: ${ISSUE_TRIAGE_BOT_LOGIN}
      ISSUE_TRIAGE_GUEST_IMAGE: ${ISSUE_TRIAGE_GUEST_IMAGE}

    scheduler:
      enabled: true
      sandbox_policy: new
      # Webhook queue rules on the daemon provide the actual concurrency bound.
      concurrency_policy: parallel
      script:
        provider: file
        path: ./loaders/github-issue.js
