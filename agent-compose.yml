name: engineering-agent-workflows

env_file:
  - .env

agents:
  issue-triage:
    enabled: true
    display_name: Issue Triage (GitLab + GitHub)
    description: Classify, prioritize, and relate GitLab and GitHub Issues without rewriting titles.
    provider: codex
    model: ${ISSUE_TRIAGE_MODEL}
    image: agent-compose-guest:local

    driver:
      docker: {}

    env:
      GITLAB_TOKEN:
        value: ${GITLAB_TOKEN}
        secret: true
      GITLAB_API_URL: ${GITLAB_API_URL}
      GITHUB_TOKEN:
        value: ${GITHUB_TOKEN}
        secret: true
      GITHUB_API_URL: ${GITHUB_API_URL}
      GITHUB_BOT_LOGIN: ${GITHUB_BOT_LOGIN}
      GITHUB_ALLOWED_REPOSITORY: ${GITHUB_ALLOWED_REPOSITORY}
      ISSUE_TRIAGE_APPLY: ${ISSUE_TRIAGE_APPLY}
      GITLAB_BOT_USERNAME: ${GITLAB_BOT_USERNAME}

    skills:
      - name: issue-triage
        provider: file
        path: ./agents/issue-triage

    scheduler:
      enabled: true
      sandbox_policy: new
      concurrency_policy: parallel
      script:
        provider: file
        path: ./loaders/issue-triage.js

  draft-pr:
    enabled: true
    display_name: Draft PR Agent (GitHub)
    description: Implement approved Issues, create Draft Pull Requests, and repair verified review or CI failures.
    provider: codex
    model: ${DRAFT_PR_MODEL}
    image: agent-compose-guest-go:local

    driver:
      docker: {}

    env:
      GITHUB_TOKEN:
        value: ${GITHUB_TOKEN}
        secret: true
      GITHUB_API_URL: ${GITHUB_API_URL}
      GITHUB_SERVER_URL: ${GITHUB_SERVER_URL}
      GITHUB_BOT_LOGIN: ${GITHUB_BOT_LOGIN}
      DRAFT_PR_ALLOWED_REPOSITORY: ${DRAFT_PR_ALLOWED_REPOSITORY}
      DRAFT_PR_APPLY: ${DRAFT_PR_APPLY}
      DRAFT_PR_GIT_AUTHOR_NAME: ${DRAFT_PR_GIT_AUTHOR_NAME}
      DRAFT_PR_GIT_AUTHOR_EMAIL: ${DRAFT_PR_GIT_AUTHOR_EMAIL}
      DRAFT_PR_GIT_CURL_RESOLVE: ${DRAFT_PR_GIT_CURL_RESOLVE}
      MONKEYSCAN_BOT_LOGIN: ${MONKEYSCAN_BOT_LOGIN}
      MONKEYSCAN_BOT_USER_ID: ${MONKEYSCAN_BOT_USER_ID}

    skills:
      - name: draft-pr
        provider: file
        path: ./agents/draft-pr

    scheduler:
      enabled: true
      sandbox_policy: new
      concurrency_policy: parallel
      script:
        provider: file
        path: ./loaders/draft-pr.js
