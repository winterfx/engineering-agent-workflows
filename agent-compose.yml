name: engineering-agent-workflows

env_file:
  - .env

agents:
  issue-triage:
    enabled: true
    display_name: Issue Triage (GitHub)
    description: Classify, prioritize, and relate GitHub Issues without rewriting titles.
    provider: codex
    model: ${ISSUE_TRIAGE_MODEL}
    image: ghcr.io/chaitin/agent-compose-guest:main

    driver:
      docker: {}

    env:
      GITHUB_TOKEN:
        value: ${GITHUB_TOKEN}
        secret: true
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_BASE64:
        value: ${GITHUB_APP_PRIVATE_KEY_BASE64}
        secret: true
      GITHUB_BOT_LOGIN: ${GITHUB_BOT_LOGIN}
      GITHUB_ALLOWED_REPOSITORY: ${GITHUB_ALLOWED_REPOSITORY}
      ISSUE_TRIAGE_APPLY: ${ISSUE_TRIAGE_APPLY}

    skills:
      - name: issue-triage
        provider: git
        url: https://github.com/winterfx/engineering-agent-workflows.git
        ref: main
        path: agents/issue-triage

    scheduler:
      enabled: true
      sandbox_policy: new
      concurrency_policy: parallel
      script:
        provider: git
        url: https://github.com/winterfx/engineering-agent-workflows.git
        ref: main
        path: agents/issue-triage/scheduler.js

  draft-pr:
    enabled: true
    display_name: Draft PR Agent (GitHub)
    description: Implement approved Issues, create Draft Pull Requests, and repair verified review or CI failures.
    provider: codex
    model: ${DRAFT_PR_MODEL}
    image: ghcr.io/winterfx/agent-compose-guest-dev:main

    driver:
      docker: {}

    env:
      GITHUB_TOKEN:
        value: ${GITHUB_TOKEN}
        secret: true
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_BASE64:
        value: ${GITHUB_APP_PRIVATE_KEY_BASE64}
        secret: true
      GITHUB_BOT_LOGIN: ${GITHUB_BOT_LOGIN}
      DRAFT_PR_ALLOWED_REPOSITORY: ${DRAFT_PR_ALLOWED_REPOSITORY}
      DRAFT_PR_APPLY: ${DRAFT_PR_APPLY}
      DRAFT_PR_GIT_AUTHOR_NAME: ${DRAFT_PR_GIT_AUTHOR_NAME}
      DRAFT_PR_GIT_AUTHOR_EMAIL: ${DRAFT_PR_GIT_AUTHOR_EMAIL}

    skills:
      - name: draft-pr
        provider: git
        url: https://github.com/winterfx/engineering-agent-workflows.git
        ref: main
        path: agents/draft-pr

    scheduler:
      enabled: true
      sandbox_policy: new
      concurrency_policy: parallel
      script:
        provider: git
        url: https://github.com/winterfx/engineering-agent-workflows.git
        ref: main
        path: agents/draft-pr/scheduler.js
