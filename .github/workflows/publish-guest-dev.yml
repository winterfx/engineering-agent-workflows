name: Publish Draft PR development image

on:
  push:
    branches:
      - main
    paths:
      - deploy/Dockerfile.agent-compose-guest-dev
      - .github/workflows/publish-guest-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-guest-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-compose-guest-dev
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-

      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-compose-guest-dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
